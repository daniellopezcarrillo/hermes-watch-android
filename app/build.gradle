plugins { id 'com.android.application' }
android {
    namespace 'com.klywo.hermeswatch'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'com.klywo.hermeswatch'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; warningsAsErrors true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android supplies org.json at runtime; JVM tests require its real implementation.
    testImplementation 'org.json:json:20240303'
}
